name: Build XCAN firmware

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to publish the rolling release
    steps:
      - uses: actions/checkout@v6

      - name: install toolchain...
        run: sudo apt install -y gcc-arm-none-eabi

      - name: build firmware...
        run: make

      - name: upload artifacts...
        uses: actions/upload-artifact@v7
        with:
          name: pcan-firmware-${{ github.sha }}
          path: |
            build-*/pcan_*_hw.hex
            build-*/pcan_*_hw.bin
