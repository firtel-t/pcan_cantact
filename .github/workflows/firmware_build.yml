name: Build XCAN firmware

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: install toolchain...
        run: sudo apt install -y gcc-arm-none-eabi

      - name: build firmware...
        run: make
